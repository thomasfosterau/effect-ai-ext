# pnpm workspace for the @thomasfosterau/effect-ai-* package family.
#
# The `catalog:` protocol pins the versions that MUST be singletons across the
# workspace. `effect` especially: two copies break Context / Layer / Schema
# identity at runtime, so every package takes it from `catalog:` as a
# devDependency for building/testing and declares it as a peerDependency
# through `catalog:peers`. On `pnpm publish`, pnpm rewrites `catalog:` /
# `catalog:peers` / `workspace:*` to concrete ranges, so published consumers
# get ordinary version specs.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages);
# `catalogMode: strict` makes `pnpm add` enforce that at add time. After
# editing this catalog, ALWAYS run `pnpm install` and commit the regenerated
# pnpm-lock.yaml — a stale lockfile fails every CI job at once with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# The Effect line (`effect`, `@effect/ai-anthropic`, `@effect/platform-node`,
# `@effect/platform-node-shared`) moves as one: every package builds and tests
# against the same exact rc, the one the consuming applications run (issue
# #32). The published peer RANGES live in the `peers` named catalog below.
#
# TypeScript is the 6/7 side-by-side split (see AGENTS.md → Conventions):
#   - `@typescript/native` (real `typescript@7`) provides the fast native `tsc`
#     used for type-checking (`vp run check`), patched by `@effect/tsgo`.
#   - `typescript` (aliased to `@typescript/typescript6`) provides the TS6
#     JS-API compiler (bin `tsc6`) that `@effect/language-service` and
#     `vp pack`'s (tsdown's) declaration bundler need.
#
# The Vite+ toolchain (`vite-plus`: `vp` with Oxfmt, Oxlint, Vitest and tsdown)
# is copied from the effect-web library; its catalog entries below carry that
# repo's notes on why `vite-plus`, `vite`, `vitest`, `@vitest/coverage-istanbul`
# and `@effect/tsgo` move as one set.
packages:
  - packages/*

catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  "@cloudflare/workers-types": ^5.20261004.1
  "@effect/ai-anthropic": 4.0.0
  "@effect/language-service": ^0.87.3
  "@effect/platform-node": 4.0.0
  # Transitive only (via @effect/platform-node's `^` range); pinned and
  # overridden so it cannot float ahead of `effect` — 4.0.0 peers on
  # `effect ^4.0.0`, which the singleton override would silently mask.
  # BUMP BY HAND with the rest of the Effect line: no manifest names it, so
  # Dependabot's `effect` group never proposes it, and nothing flags a stale
  # pin — the `effect` override rewrites its peer spec too, so
  # `pnpm peers check` stays silent. Keep it equal to `effect` below.
  "@effect/platform-node-shared": 4.0.0
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch --typescript --oxlint` (the root
  # `prepare`) overwrites the native `tsc` binary with an Effect-patched build
  # matched by package version, and patches the `oxlint` that `vite-plus`
  # pulls in, so this pins in lockstep with `@typescript/native` below (0.47.2
  # ships against typescript 7.0.2 and 7.1.0-dev.20260929.1) and with the
  # `oxlint` and `oxlint-tsgolint` that `vite-plus` carries (0.47.2 supports
  # oxlint 1.82.0 – 1.86.0 and tsgolint 7.0.2001 / 7.0.2003; vite-plus 1.0.0
  # carries oxlint 1.85.0 and tsgolint 7.0.2003). Each @effect/tsgo release
  # hard-errors (UnsupportedTargetPackageVersionError) on any other component
  # version, failing `pnpm install` itself. Read the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping any of the
  # three.
  "@effect/tsgo": 0.47.2
  # The Effect rule set for Oxlint (`vp lint`), on top of @effect/tsgo's
  # `recommended` preset. See the scoped `effect` override below.
  "@mpsuesser/oxlint-plugin-effect": ^0.5.0
  "@types/node": ^26.6.4
  "@typescript/native": "npm:typescript@7.0.2"
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.1
  effect: 4.0.0
  # The dead-code / health gate (`.fallowrc.json`; the Claude Code PreToolUse
  # hook `.claude/hooks/fallow-gate.sh` runs `fallow audit` before every agent
  # `git commit` / `git push`).
  fallow: 3.31.0
  typescript: "npm:@typescript/typescript6@6.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.0.0 carries oxlint 1.85.0,
  # oxfmt 0.70.0 and vitest 5.0.1; 1.1.0 moves to oxlint 1.87.0, which
  # @effect/tsgo 0.47.2 does not support. `vite` is the same release under its
  # aliased core package, and `vitest` must match vite-plus's exact pin
  # (1.0.0 → 5.0.1) because the `vitest: "catalog:"` override forces every
  # resolution to the catalog singleton.
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1

# Peer ranges the PUBLISHED packages declare: an open floor, never an exact
# pin (an exact `4.0.0-rc.115` peer would reject a consumer on rc.118), per
# the shared Effect-floor policy (effect-jsonapi#115). Kept as a named catalog
# so `catalogMode: strict` still governs them; `pnpm publish` replaces
# `catalog:peers` with these ranges in the published manifest. The floor is
# the rc the code is built and tested on — rc.118, after the
# `effect/unstable/*` -> `effect/*` path move (issue #51), which older rcs lack.
# Re-verify by pointing the default catalog's Effect line at the floor before
# lowering or raising it. `@cloudflare/workers-types` is the gateway's
# optional, types-only peer (its binding transports), while the default
# catalog pins the version the gateway builds against. Its floor (#93) is
# 4.20260410.1, the first release in which the gateway's source type-checks:
# `Ai` and `AIGatewayProviders` / `AIGatewayUniversalRequest` arrive in
# 4.20241214.0, `AiGateway.getUrl()` in 4.20250312.0, and the `signal` option
# on `AiGateway.run()` (which `gatewayRun` passes so interruption cancels the
# subrequest) in 4.20260410.1. Re-verify by pointing the default catalog's
# entry at the floor and running the gateway's `check`.
catalogs:
  peers:
    "@cloudflare/workers-types": ">=4.20260410.1"
    "@effect/ai-anthropic": ">=4.0.0-rc.118"
    "@effect/platform-node": ">=4.0.0-rc.118"
    effect: ">=4.0.0-rc.118"

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # Keep equal to `effect`'s pin above — bumped by hand (see its catalog entry).
  "@effect/platform-node-shared": "catalog:"
  # @mpsuesser/oxlint-plugin-effect@0.5.0 is built on effect beta.100 and calls
  # `Schema.isIncludes` (renamed `isIncluding` in rc.118) when it loads, so the
  # singleton override above would crash `vp lint`. Scoped override: only the
  # lint plugin keeps its own Effect (copied from effect-web; website#2015).
  # Remove once the plugin ships an rc.118+ build.
  "@mpsuesser/oxlint-plugin-effect>effect": "4.0.0-beta.100"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# pnpm 11 fails the install on dependency build scripts that are neither
# allowed nor denied here (pnpm 10 only warned). esbuild (an optional
# dependency of vite-plus's core) places its platform binary in a
# postinstall; msgpackr-extract arrives via @effect/platform-node and builds an
# optional native accelerator. fallow needs no entry: it has no install script
# and takes its binary from its `@fallow-cli/*` optional dependencies.
allowBuilds:
  esbuild: true
  msgpackr-extract: true

# Supply-chain delay (the owner's policy, gardeneria #1149): hold newly
# published versions for 1 day (unit: MINUTES) before pnpm will install them.
# `.github/dependabot.yml`'s `cooldown` mirrors this window.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
