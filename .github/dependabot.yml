# Dependabot version-update configuration (a subset of effect-drizzle-ext's,
# whose shape the gardeneria application's catalog set).
#
# Scope: the npm dependencies (pnpm maintains `pnpm-lock.yaml` directly, so
# Dependabot regenerates the lockfile in the same PR as the bump) and the
# GitHub Actions used by the workflows (SHA-pinned; Dependabot keeps the SHA
# and its `# vX.Y.Z` comment current together).
#
# `groups` collect dependencies that MUST move together into a single PR:
#
# - `effect`: `effect` + `@effect/*` — the Effect 4 release line is a
#   lockstep-versioned singleton set (see the `catalog:` comment in
#   pnpm-workspace.yaml). `@effect/platform-node-shared` is pinned there only
#   through the catalog + `overrides` (no manifest names it), so this group
#   never proposes it: bump it by hand to the same rc in the same PR.
#   `@effect/tsgo` is excluded: it belongs to the TypeScript set below, not
#   the Effect line.
# - `vitest-toolchain`: `vitest` + `@vitest/*`.
#
# `ignore` keeps Dependabot from proposing the TypeScript toolchain set:
# `@effect/tsgo` + `@typescript/native` + `typescript` (the 6/7 side-by-side
# split). `effect-tsgo patch` matches the native `tsc` by package version and
# ships artifacts for an explicit set of TypeScript versions only, so any
# pairing it has no artifact for fails `pnpm install`
# (UnsupportedTargetPackageVersionError). Grouping the three did not make a
# bump safe, so they move BY HAND, as one set (together with `vite-plus`
# wherever a workspace uses it; this one does not), after reading the
# `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs. The
# ignore covers the `version-update:semver-*` update types only: SECURITY
# updates for the three stay enabled (a bare `dependency-name` ignore would
# block them too).
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` so Dependabot
# never proposes a version pnpm's own supply-chain gate would then reject at
# install time. `@thomasfosterau/*` is excluded to match the first-party
# exemption there. Cooldown applies only to *version* updates — security
# updates are opened immediately regardless of age.
version: 2
updates:
  - package-ecosystem: "npm" # covers the pnpm-lock.yaml lockfile
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      - dependency-name: "@effect/tsgo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@typescript/native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
