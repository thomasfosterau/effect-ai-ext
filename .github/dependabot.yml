# Dependabot version updates: the npm ecosystem at `/` (it reads the pnpm
# workspace, its catalogs and `pnpm-lock.yaml`, and regenerates the lockfile
# in the same PR as the bump) and the SHA-pinned GitHub Actions (Dependabot
# keeps each SHA and its `# vX.Y.Z` comment current together).
#
# `groups` collect the dependencies that MUST move together into one PR.
# Dependabot puts a dependency in the FIRST group that matches it, so the
# groups run specific → general, and `exclude-patterns` keep a name out of a
# broader group it would otherwise also match:
#
# - `toolchain`: `vite-plus` pins the `oxlint`, `oxfmt` and `vitest` it carries
#   (so `vite`, `vitest` and `@vitest/coverage-istanbul` follow it), and
#   `effect-tsgo patch --typescript --oxlint` hard-errors
#   (UnsupportedTargetPackageVersionError, failing `pnpm install`) on any
#   TypeScript / oxlint / tsgolint version its `components` table does not
#   list. So `@effect/tsgo`, `@typescript/native`, `typescript` (the TS6
#   alias) and `vite-plus` move as one set, with the lint plugin
#   (`@enfect/oxlint`, checked against the oxlint vite-plus carries). Before
#   merging a toolchain PR, check the pairing against the `components` table
#   in node_modules/@effect/tsgo/dist/effect-tsgo.cjs (see the catalog notes in
#   pnpm-workspace.yaml).
# - `effect`: the Effect line (`effect`, `@effect/ai-anthropic`,
#   `@effect/platform-node`) shares one exact version, and `@effect/docgen` is
#   pinned to it too (its own `effect` dependency would otherwise be masked by
#   the singleton override). `@effect/platform-node-shared` is named only in
#   the catalog and `overrides`, so Dependabot never proposes it: bump it by
#   hand to the same version in the same PR. `@effect/tsgo` belongs to the
#   toolchain and `@effect/language-service` is not on the Effect line.
# - `cloudflare`: `@cloudflare/*` (+ `wrangler`, if one is ever added).
# - `changesets`: `@changesets/*`.
# - `minor-and-patch`: everything else's minor and patch updates in one PR, so
#   PR volume stays low; a major outside the lockstep sets stays individual.
#
# `cooldown`: pnpm-workspace.yaml's `minimumReleaseAge` is 480 minutes (8
# hours), but Dependabot's cooldown takes whole days only, so it waits 1 day.
# That is longer than pnpm's window, so a Dependabot PR never proposes a
# version pnpm's own supply-chain gate would still reject at install time;
# `@thomasfosterau/*` is exempt, as it is there. Cooldown applies only to
# version updates: security updates open at once.
#
# Hand moves (Dependabot cannot make them; do them on the matching PR's
# branch, then `pnpm install`):
# - the `vite` npm alias (`npm:@voidzero-dev/vite-plus-core@<v>`, equal to
#   `vite-plus`) and the `vitest` / `@vitest/coverage-istanbul` pins
#   vite-plus dictates: run
#   `pnpm dlx --package=vite-plus@<v> vp migrate --no-interactive` on the
#   toolchain PR, then drop the `minimumReleaseAgeExclude` entries it adds;
# - `typescript` (`npm:@typescript/typescript6@<v>`) and `@typescript/native`
#   (`npm:typescript@<v>`): aliases, moved to a pairing `@effect/tsgo`'s
#   `components` table supports;
# - `@effect/platform-node-shared`, catalog/override only: equal to `effect`;
# - the `undici` security floor under `overrides`: drop it once the
#   resolution reaches the fix on its own.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/oxlint"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
        update-types: ["major", "minor", "patch"]
      cloudflare:
        applies-to: version-updates
        patterns:
          - "@cloudflare/*"
          - "wrangler"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
