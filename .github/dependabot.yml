# Dependabot version updates: the npm ecosystem at `/` (it reads the pnpm
# workspace, its catalogs and `pnpm-lock.yaml`, and regenerates the lockfile
# in the same PR as the bump) and the SHA-pinned GitHub Actions (Dependabot
# keeps each SHA and its `# vX.Y.Z` comment current together).
#
# `groups` collect the dependencies that MUST move together into one PR.
# Dependabot puts a dependency in the FIRST group that matches it, so the
# groups run specific → general, and `exclude-patterns` keep a name out of a
# broader group it would otherwise also match:
#
# - `toolchain`: `vite-plus` pins the `oxlint`, `oxfmt` and `vitest` it carries
#   (so `vite`, `vitest` and `@vitest/coverage-istanbul` follow it), and
#   `effect-tsgo patch --typescript --oxlint` hard-errors
#   (UnsupportedTargetPackageVersionError, failing `pnpm install`) on any
#   TypeScript / oxlint / tsgolint version its `components` table does not
#   list. So `@effect/tsgo`, `@typescript/native`, `typescript` (the TS6
#   alias) and `vite-plus` move as one set, with the lint plugin. Before
#   merging a toolchain PR, check the pairing against the `components` table
#   in node_modules/@effect/tsgo/dist/effect-tsgo.cjs (see the catalog notes in
#   pnpm-workspace.yaml).
# - `effect`: the Effect line (`effect`, `@effect/ai-anthropic`,
#   `@effect/platform-node`) shares one exact version, and `@effect/docgen` is
#   pinned to it too (its own `effect` dependency would otherwise be masked by
#   the singleton override). `@effect/platform-node-shared` is named only in
#   the catalog and `overrides`, so Dependabot never proposes it: bump it by
#   hand to the same version in the same PR. `@effect/tsgo` belongs to the
#   toolchain and `@effect/language-service` is not on the Effect line.
# - `cloudflare`: `@cloudflare/*` (+ `wrangler`, if one is ever added).
# - `changesets`: `@changesets/*`.
# - `minor-and-patch`: everything else's minor and patch updates in one PR, so
#   PR volume stays low; a major outside the lockstep sets stays individual.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day) so
# Dependabot never proposes a version pnpm's own supply-chain gate would then
# reject at install time; `@thomasfosterau/*` is exempt, as it is there.
# Cooldown applies only to version updates: security updates open at once.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@mpsuesser/oxlint-plugin-effect"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
        update-types: ["major", "minor", "patch"]
      cloudflare:
        applies-to: version-updates
        patterns:
          - "@cloudflare/*"
          - "wrangler"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
