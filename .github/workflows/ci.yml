name: CI

# One gate job, `ci`: the pipeline's task graph lives in vite.config.ts (the
# root `check` and `check:dist` tasks and every package's `test:unit` /
# `build`), not in GitHub Actions `needs:`. Copied in shape from the effect-web
# library (#58), which took it from effect-drizzle-ext and the gardeneria
# application. Nothing here needs a database, a stage or a credential, so
# every PR class runs the whole gate.
#
# The default branch is `trunk` (not `main`) — the triggers below must say so
# or the workflow never fires (issue #30).
#
# Every third-party action is pinned to a full commit SHA (the tag is a comment
# for humans and Dependabot's `github-actions` ecosystem keeps both current).
#
# The `ci` job runs on the latest stable Node (`node-version: latest` in the
# setup action), as every repository in the family does (#71). `engines.node`
# in the published packages is the consumer floor and is deliberately not tied
# to it, so the `node-floor` job reruns the runtime gates (tests, build,
# check:dist) on that floor, 22.18.0, which `latest` alone never exercises
# (#83).

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; each job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      - name: Format and lint
        run: vp check
      # Native TS7 type-check (`tsc`, patched by @effect/tsgo on install) of
      # every package.
      - name: Type gates
        run: vp run --concurrency-limit 2 check
      # Recorded/stubbed fixtures only, no live-key or live-network tests.
      - name: Unit tests
        run: vp run -r test:unit
      # The suites again under Istanbul, failing if any package's coverage
      # drops below its floor (`coverageFloor` in each package's
      # vite.config.ts, #100). effect-web runs no coverage step, so its
      # thresholds bite only locally; here the ratchet is a CI gate. `-r` runs
      # each package's own suite against only its own tests: the root task
      # alone merges every package's tests into one map, so another package's
      # tests can cover a file and hide a drop. `-r` includes the root task,
      # so it also refreshes coverage/coverage-final.json (fallow's map),
      # though nothing in CI reads it.
      - name: Coverage floors
        run: vp run -r test:coverage
      - name: Build
        run: vp run -r build
      # Imports every built entry under real Node ESM and checks every value
      # export its declarations promise exists at runtime, then launches the
      # `effect-evals` bin from a packed tarball (`scripts/check-dist.mjs`,
      # #32, #42).
      - name: Dist import check
        run: vp run check:dist
      - name: Audit
        run: pnpm audit --audit-level high

  # The runtime gates on the `engines.node` floor (`>=22.18`). Pinned to the
  # exact floor version, not `22`, so a newer 22.x can't hide a floor-only
  # failure. Raise it together with `engines.node` in the root and
  # `packages/effect-evals` package.json. No task cache: every gate runs.
  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22.18.0
      - name: Unit tests
        run: vp run -r test:unit
      - name: Build
        run: vp run -r build
      - name: Dist import check
        run: vp run check:dist
