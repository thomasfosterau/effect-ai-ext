name: Release

# Changesets release for the @thomasfosterau/effect-ai-* packages: opens the
# version PR (`chore: version packages`) and, once the owner merges it,
# publishes with npm trusted publishing (OIDC). The flow, the provenance
# posture and the owner's one-time setup are in PUBLISHING.md. The default
# branch is `trunk`, not `main` (issue #30).
#
# The job runs in the `release` environment (the library standard), so
# required reviewers added to it gate every publish.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on the owner's behalf).
    if: github.repository == 'thomasfosterau/effect-ai-ext'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # push the version branch and tags
      pull-requests: write # open/update the version PR
      id-token: write # mint the OIDC token npm exchanges for publish creds
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below. That re-install runs the root `prepare` (`vp config` +
      # `effect-tsgo patch`) and every `allowBuilds` dependency's build script
      # inside this job, which holds `id-token: write`. It triggers whenever
      # a manifest's mtime moves after the install step, e.g. when the
      # Changesets action checks out an existing `changeset-release/trunk`
      # and `git reset --hard`s it back before `pnpm run changeset:version`.
      # Scoped to this job: CI and local runs keep the default. pnpm 11 reads
      # only the `pnpm_config_*` spelling; `npm_config_verify_deps_before_run`
      # is ignored. Copied from effect-web's release job (#105).
      pnpm_config_verify_deps_before_run: "false"
    steps:
      # The Changesets action pushes the version branch, so it needs the
      # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm before Node so setup-node's `cache: pnpm` can resolve the store
      # path. The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It also
      # skips this workspace's own `prepare` (`vp config`'s git hooks and the
      # `effect-tsgo` patch of tsc/oxlint), neither of which the `vp pack`
      # build, `changeset version` or `vp fmt` needs: the packed tarballs are
      # byte-identical to a build from a scripted install (#105). The
      # `allowBuilds` scripts (esbuild, msgpackr-extract) are skipped too,
      # and that same comparison shows neither is needed. It only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see the job
      # `env` above); otherwise a later `pnpm run` could re-install with
      # scripts.
      #
      # No check or test step: CI (ci.yml) runs every gate on each PR into
      # `trunk` and on each push to `trunk`, so this job runs only what
      # publishing needs. On the version PR, which github-actions[bot] pushes,
      # the CI run waits for the owner's "Approve and run"; approve it and let
      # it pass before merging. Nothing enforces that: `trunk` has no required
      # checks. `changeset:publish` builds every package (`vp run -r build`)
      # before publishing, so a build break still stops the publish.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The job installs no npm CLI of its own: `changeset publish` runs
      # `pnpm publish` (pnpm 11 publishes natively, never via npm) and pnpm
      # performs the trusted-publishing (OIDC) exchange itself (#63).
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in the
      # root devDependencies) and renamed v1's `version` / `publish` / `commit`
      # / `title` inputs.
      - name: Create Release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run changeset:version
          publish-script: pnpm run changeset:publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
