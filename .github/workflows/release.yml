name: Release

# Changesets-driven release for the @thomasfosterau/effect-ai-* packages,
# publishing to npm via **Trusted Publishing** (tokenless OIDC).
#
# Flow: merge PRs that include a changeset (`pnpm changeset`) into `trunk`
# (the default branch — not `main`; issue #30). This workflow then opens or
# updates a "Version Packages" PR that bumps versions and writes changelogs;
# merging THAT PR publishes the bumped packages. With no pending changesets,
# any package whose version is not yet on the registry is published (packages
# already on the registry are skipped, so a no-op run is green).
#
# Auth & provenance — no NPM_TOKEN:
#   npm exchanges this job's GitHub OIDC token (`id-token: write`) for
#   short-lived publish credentials, so there is no long-lived token to store or
#   rotate. Provenance is generated automatically by trusted publishing (no
#   `NPM_CONFIG_PROVENANCE` needed). This requires:
#     1. npm CLI >= 11.5.1 at publish time (installed below), and
#     2. a Trusted Publisher configured on npmjs.com for EACH package, pointing
#        at `thomasfosterau/effect-ai-ext` + this workflow file (`release.yml`).
#   Until (2) is done for a package, its publish step fails auth — configure the
#   trusted publishers before cutting a versioned release. See the repo's
#   release docs (AGENTS.md → Versioning & releases).
#
# The job runs in the `release` GitHub Environment (the library standard —
# see effect-jsonapi's release.yml). GitHub creates the environment on first
# use; adding required reviewers to it in the repository settings turns every
# run into a manually approved one.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on the owner's behalf).
    if: github.repository == 'thomasfosterau/effect-ai-ext'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the Version Packages PR / tags
      pull-requests: write # open/update the Version Packages PR
      id-token: write # mint the OIDC token npm exchanges for publish creds
    steps:
      # The Changesets action pushes the version branch, so it needs the
      # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm before Node so setup-node's `cache: pnpm` can resolve the store
      # path. The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (tokenless OIDC + automatic provenance) needs a recent
      # npm CLI; the runner's bundled npm predates it. `changeset publish` shells
      # out to this `npm publish`, which detects the Actions OIDC environment.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in the
      # root devDependencies) and renamed v1's `version` / `publish` / `commit`
      # / `title` inputs.
      - name: Create Release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run changeset:version
          publish-script: pnpm run changeset:publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
