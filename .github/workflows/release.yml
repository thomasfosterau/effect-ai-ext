name: Release

# Changesets-driven release for the @thomasfosterau/effect-ai-* packages.
#
# Flow: merge PRs that include a changeset (`pnpm changeset`) into `main`.
# This workflow then opens/updates a "Version Packages" PR that bumps versions
# and writes changelogs; merging THAT PR publishes the bumped packages to npm.
# With no pending changesets, any package whose version is not yet on the
# registry is published.
#
# Provenance: every publish here carries npm provenance, generated from the
# GitHub OIDC token (`id-token: write`) with `NPM_CONFIG_PROVENANCE=true`. This
# is why provenance lives here and NOT in each package's `publishConfig` — a
# by-hand `changeset publish` (no OIDC provider) would otherwise fail with
# `EUSAGE: Automatic provenance generation not supported`. Provenance requires
# the package to be published with public access (it is) from GitHub-hosted
# runners; a public source repo is the simplest case.
#
# Auth: `actions/setup-node` with `registry-url` writes an `.npmrc` that reads
# `NODE_AUTH_TOKEN` at publish time, so the token is passed under that name (an
# automation "Publish" token for the @thomasfosterau scope, stored as the
# `NPM_TOKEN` repository secret). The changesets step is gated on that secret,
# so the workflow is a clean no-op until it exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the Version Packages PR / tags
      pull-requests: write # open/update the Version Packages PR
      id-token: write # mint the OIDC token npm uses for provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - name: Create Release PR or publish
        if: ${{ env.NPM_TOKEN != '' }}
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Matches the `.npmrc` written by setup-node's `registry-url`.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Emit npm provenance from the OIDC token minted above.
          NPM_CONFIG_PROVENANCE: "true"
